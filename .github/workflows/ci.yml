name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warehouse-environment:
    name: Warehouse pipeline, publication and replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify full warehouse pipeline, reports, replay and deployment
        run: python3 scripts/verify_deployment.py --warehouse
      - name: Save warehouse verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warehouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployment/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript and translations
        run: |
          node --check ticketing/web/app.js
          node --check ticketing/web/i18n.mjs
          node --test tests/js/web.test.mjs tests/js/i18n.test.mjs

  deployment:
    name: PostgreSQL and fresh deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Docker deployment, transactions and HTTP flow
        run: python3 scripts/verify_deployment.py
      - name: Save sanitized verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployment/
          if-no-files-found: warn
          retention-days: 7
