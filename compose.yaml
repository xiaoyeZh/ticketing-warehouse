name: ticketing-warehouse

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先复制 .env.example 为 .env 并设置数据库密码}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    shm_size: 128mb
    command: ["postgres", "-c", "timezone=UTC"]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  app:
    image: ${TICKETING_IMAGE:-ticketing-warehouse-python:local}
    build: .
    profiles: [tools]
    environment: &booking_environment
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ticketing}
      PGUSER: ticketing_app
      PGPASSWORD: ${TICKETING_APP_PASSWORD:?请在 .env 中设置 TICKETING_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${TICKETING_IMAGE:-ticketing-warehouse-python:local}
    build: .
    init: true
    restart: unless-stopped
    environment: *booking_environment
    entrypoint: [python, -m, uvicorn]
    command: ["ticketing.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-admin:
    image: ${TICKETING_IMAGE:-ticketing-warehouse-python:local}
    build: .
    profiles: [tools]
    environment: &admin_environment
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ticketing}
      PGUSER: ${POSTGRES_USER:-ticketing_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
      TICKETING_APP_PASSWORD: ${TICKETING_APP_PASSWORD:?请设置应用数据库密码}
    command: [init]
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    image: ${TICKETING_IMAGE:-ticketing-warehouse-python:local}
    build: .
    profiles: [tools]
    environment: *admin_environment
    entrypoint: [python, -m, unittest]
    command: [discover, -s, tests/python, -v]
    depends_on:
      postgres:
        condition: service_healthy

  reservation-worker:
    image: ${TICKETING_IMAGE:-ticketing-warehouse-python:local}
    build: .
    profiles: [workers]
    environment: *booking_environment
    command: [worker, --interval, "5"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  warehouse:
    image: ${WAREHOUSE_IMAGE:-ticketing-warehouse-spark:local}
    build:
      context: .
      dockerfile: docker/warehouse.Dockerfile
    profiles: [warehouse]
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ticketing}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:-}
      WAREHOUSE_WRITER_PASSWORD: ${WAREHOUSE_WRITER_PASSWORD:-}
      WAREHOUSE_DATA_DIR: /warehouse-data
    volumes:
      - warehouse_data:/warehouse-data
    command: [--help]

  warehouse-admin:
    image: ${TICKETING_IMAGE:-ticketing-warehouse-python:local}
    build: .
    profiles: [warehouse]
    environment:
      <<: *admin_environment
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:-}
      WAREHOUSE_WRITER_PASSWORD: ${WAREHOUSE_WRITER_PASSWORD:-}
      WAREHOUSE_REPORTER_PASSWORD: ${WAREHOUSE_REPORTER_PASSWORD:-}
    entrypoint: [python, -m, warehouse]
    command: [init-db]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  warehouse_data:
